<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minuteur - Time Apps</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">TimeApps</div>
            <ul class="nav-links">
                <li><a href="réveil.html">Réveil</a></li>
                <li><a href="horloge.html">Horloge</a></li>
                <li><a href="minuteur.html">Minuteur</a></li>
                <li><a href="chronomètre.html">Chronomètre</a></li>
            </ul>
        </div>
    </nav>

    <div class="content">
        <div class="timer-container">
            <h1 class="timer-title">Minuteur</h1>
            
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            
            <div class="timer-inputs">
                <div class="input-group">
                    <label for="hours">Heures</label>
                    <input type="number" id="hours" min="0" max="23" value="0">
                </div>
                <div class="input-group">
                    <label for="minutes">Minutes</label>
                    <input type="number" id="minutes" min="0" max="59" value="0">
                </div>
                <div class="input-group">
                    <label for="seconds">Secondes</label>
                    <input type="number" id="seconds" min="0" max="59" value="0">
                </div>
            </div>

            <div class="timer-buttons">
                <button class="btn btn-start" id="startBtn">Démarrer</button>
                <button class="btn btn-pause" id="pauseBtn">Pause</button>
                <button class="btn btn-reset" id="resetBtn">Réinitialiser</button>
            </div>

            <div class="timer-status" id="timerStatus"></div>
        </div>

        <a href="index.html" class="back-link">Retour à l'accueil</a>
    </div>

    <script src="scrip.js/minuteur.js"></script>
</body>
</html>
